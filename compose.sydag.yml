name: sydag

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.sydag
      args:
        # Production reads everything from /api (nginx proxies it to the backend).
        # Set VITE_DEMO_MODE=true only to build the bundled demo deliberately.
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}

    container_name: sydag_frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8188:80"

    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 64

    networks:
      - sydag_internal
      - lostnfound_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sydag_backend
    restart: unless-stopped

    # Model artifacts live outside the image: drop a new model into
    # backend/artifacts/<model_id>/ and `docker compose restart backend`.
    # Public-data responses (soil, weather, yields) are cached in a named volume
    # so they survive restarts and outages of the USDA / NOAA services.
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
      - context_cache:/app/cache

    environment:
      # "model" serves forecasts from backend/artifacts + backend/data/practice; "mock"
      # serves the demo dataset. There is no automatic fallback between them.
      SOILSIGNAL_DATA_SOURCE: ${SOILSIGNAL_DATA_SOURCE:-model}
      # Optional: free key from https://quickstats.nass.usda.gov/api enables county yields.
      SOILSIGNAL_NASS_API_KEY: ${SOILSIGNAL_NASS_API_KEY:-}

    ports:
      - "127.0.0.1:8189:8000"

    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256  # numeric libraries spawn a thread per core

    networks:
      - sydag_internal
      - lostnfound_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sydag_internal:
    name: sydag_internal
    driver: bridge

  lostnfound_network:
    external: true
    name: lostnfound_network

volumes:
  context_cache:
    name: sydag_context_cache
