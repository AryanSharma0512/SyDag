[project]
name = "soilsignal-backend"
version = "0.1.0"
description = "SoilSignal API: serves field forecasts to the dashboard"
requires-python = ">=3.13"
dependencies = [
    "catboost==1.2.10",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
ml = [
    "imagecodecs>=2026.8.16",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "tifffile>=2026.9.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
